<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>GiftLoop — group gift, one link</title>
<style>
:root{font-family:Inter,system-ui,-apple-system,Segoe UI,sans-serif;color:#171717;background:#f5f5f2}
*{box-sizing:border-box} body{margin:0}.wrap{max-width:760px;margin:0 auto;padding:28px 18px 64px}.brand{font-weight:800;font-size:24px;letter-spacing:-.04em}.hero{padding:58px 0 28px}.eyebrow{font-size:13px;font-weight:700;text-transform:uppercase;letter-spacing:.12em;opacity:.55}.hero h1{font-size:clamp(38px,8vw,66px);line-height:.96;letter-spacing:-.06em;margin:10px 0 18px;max-width:650px}.hero p{font-size:18px;line-height:1.5;opacity:.7;max-width:620px}.card{background:#fff;border:1px solid #deded8;border-radius:22px;padding:22px;box-shadow:0 10px 30px rgba(0,0,0,.05);margin-top:22px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}@media(max-width:600px){.grid{grid-template-columns:1fr}}label{display:block;font-size:13px;font-weight:700;margin:0 0 6px}input,textarea,button{font:inherit}input,textarea{width:100%;border:1px solid #d6d6cf;border-radius:12px;padding:12px 13px;background:#fff}textarea{min-height:90px;resize:vertical}button{border:0;border-radius:12px;padding:13px 16px;font-weight:800;cursor:pointer;background:#171717;color:#fff}.muted{opacity:.62}.share{display:flex;gap:10px;align-items:center;flex-wrap:wrap}.share input{flex:1;min-width:240px;background:#f5f5f2}.progress{height:12px;background:#ecece6;border-radius:99px;overflow:hidden}.bar{height:100%;background:#171717;border-radius:99px}.money{font-size:44px;font-weight:850;letter-spacing:-.05em}.people{display:grid;gap:9px;margin-top:16px}.person{display:flex;justify-content:space-between;gap:12px;padding:12px 0;border-bottom:1px solid #eee}.hidden{display:none}.success{font-weight:800}.err{color:#9d1616;font-size:14px;margin-top:10px}.footer{font-size:13px;opacity:.5;margin-top:30px}
</style>
</head>
<body>
<div class="wrap">
  <div class="brand">GiftLoop</div>
  <section id="home">
    <div class="hero"><div class="eyebrow">One link. Everyone chips in.</div><h1>Collect a group gift without a group-chat mess.</h1><p>Create a gift page, drop the link into WhatsApp, Telegram or Discord, and let everyone add their contribution. No app. No account.</p></div>
    <div class="card">
      <div class="grid">
        <div><label>What are you buying?</label><input id="title" placeholder="e.g. New headphones" /></div>
        <div><label>For whom?</label><input id="recipient" placeholder="e.g. Alex" /></div>
        <div><label>Target amount</label><input id="target" type="number" min="1" step="0.01" placeholder="150" /></div>
        <div><label>Currency</label><input id="currency" value="EUR" maxlength="8" /></div>
      </div>
      <div style="margin-top:12px"><label>Message (optional)</label><textarea id="message" placeholder="Birthday present — surprise!"></textarea></div>
      <button style="margin-top:14px" onclick="createGift()">Create gift link</button><div id="createErr" class="err"></div>
    </div>
  </section>

  <section id="gift" class="hidden"></section>
  <div class="footer">GiftLoop MVP · intentionally simple: sharing is the growth loop.</div>
</div>
<script>
const $=id=>document.getElementById(id);
function esc(s){return String(s??'').replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]))}
async function createGift(){
  $('createErr').textContent='';
  const body={title:$('title').value,recipient:$('recipient').value,target:Number($('target').value),currency:$('currency').value,message:$('message').value};
  try{const r=await fetch('/api/gifts',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)});const d=await r.json();if(!r.ok)throw new Error(d.detail||'Could not create');location.href=d.url}catch(e){$('createErr').textContent=e.message}
}
async function contribute(id){
  const name=$('name').value.trim(), amount=Number($('amount').value), note=$('note').value.trim();
  $('contribErr').textContent='';
  if(!name||!amount){$('contribErr').textContent='Name and amount are required.';return}
  const r=await fetch(`/api/gifts/${id}/contributions`,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({name,amount,note})});
  const d=await r.json(); if(!r.ok){$('contribErr').textContent=d.detail||'Could not save';return} loadGift(id)
}
async function copyLink(){await navigator.clipboard.writeText(location.href);$('copy').textContent='Copied'}
async function loadGift(id){
  const r=await fetch(`/api/gifts/${id}`); if(!r.ok){$('home').innerHTML='<div class="hero"><h1>Gift not found.</h1></div>';return}
  const d=await r.json(), g=d.gift, pct=Math.min(100,d.total/g.target*100);
  $('home').classList.add('hidden');$('gift').classList.remove('hidden');
  const list=d.contributions.map(x=>`<div class="person"><span><strong>${esc(x.name)}</strong>${x.note?`<span class="muted"> · ${esc(x.note)}</span>`:''}</span><strong>${x.amount.toFixed(2)} ${esc(g.currency)}</strong></div>`).join('')||'<div class="muted">No contributions yet. Be the first.</div>';
  $('gift').innerHTML=`<div class="hero"><div class="eyebrow">Group gift</div><h1>${esc(g.title)}</h1><p>For <strong>${esc(g.recipient)}</strong>${g.message?` · ${esc(g.message)}`:''}</p></div>
  <div class="card"><div class="money">${d.total.toFixed(2)} ${esc(g.currency)} <span class="muted" style="font-size:20px;font-weight:600">of ${Number(g.target).toFixed(2)} ${esc(g.currency)}</span></div><div class="progress" style="margin:16px 0 12px"><div class="bar" style="width:${pct}%"></div></div><div class="muted">${pct.toFixed(0)}% funded</div></div>
  <div class="card"><h2 style="margin-top:0">Add your contribution</h2><div class="grid"><div><label>Your name</label><input id="name" placeholder="Jamie" /></div><div><label>Amount</label><input id="amount" type="number" min="0.01" step="0.01" placeholder="25" /></div></div><div style="margin-top:12px"><label>Note (optional)</label><input id="note" placeholder="Happy birthday!" /></div><button style="margin-top:14px" onclick="contribute('${esc(id)}')">Add contribution</button><div id="contribErr" class="err"></div></div>
  <div class="card"><div class="share"><input readonly value="${esc(location.href)}" /><button id="copy" onclick="copyLink()">Copy link</button></div><p class="muted">Send this one link to everyone. They can contribute from the browser — no account required.</p></div>
  <div class="card"><h2 style="margin-top:0">Contributors</h2><div class="people">${list}</div></div>`;
}
const parts=location.pathname.split('/'); if(parts[1]==='g'&&parts[2])loadGift(parts[2]);
</script>
</body></html>
